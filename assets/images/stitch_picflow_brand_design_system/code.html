<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120" fill="none">
  <defs>
    <!-- sRGB Gamut Primary Soft Gradients for Shutter Blades -->
    <linearGradient id="redGamut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="greenGamut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="blueGamut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="slateNeutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="pureGlass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- sRGB Spectrum Gradient for Typography "Flow" (Red -> Green -> Blue) -->
    <linearGradient id="srgbTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="subtleAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Subtle Grounding -->
  <circle cx="62" cy="60" r="36" fill="#38BDF8" opacity="0.05" filter="url(#subtleAura)"/>

  <!-- Mark: sRGB Color Calibration & Pure Photographic Lens -->
  <g transform="translate(18, 16)">
    <!-- Outer Neutral Precision Lens Barrel -->
    <circle cx="44" cy="44" r="40" stroke="#CBD5E1" stroke-width="1.75" fill="none"/>
    <circle cx="44" cy="44" r="34" fill="#0F172A"/>

    <!-- 4 Aperture Blades: Red - Green - Blue + Slate/Silver -->
    <path d="M 44 18 C 58 18 70 29 70 44 C 56 42 46 32 44 18 Z" fill="url(#blueGamut)"/>
    <path d="M 70 44 C 70 58 59 70 44 70 C 46 56 56 46 70 44 Z" fill="url(#greenGamut)"/>
    <path d="M 44 70 C 30 70 18 59 18 44 C 32 46 42 56 44 70 Z" fill="url(#redGamut)"/>
    <path d="M 18 44 C 18 30 29 18 44 18 C 42 32 32 42 18 44 Z" fill="url(#slateNeutral)"/>

    <!-- Optical Core Lens -->
    <circle cx="44" cy="44" r="11" fill="#0B0F19" stroke="#E2E8F0" stroke-width="1.5"/>
    <ellipse cx="41" cy="40" rx="3.5" ry="2" fill="url(#pureGlass)" transform="rotate(-30 41 40)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(132, 68)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">Pic</text>
    <!-- 'Flow' with calibrated sRGB smooth gradient -->
    <text x="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="url(#srgbTextGrad)" letter-spacing="-0.03em">Flow</text>
  </g>

  <!-- Sub-label with sRGB Calibration Touch -->
  <g transform="translate(134, 90)">
    <!-- 3 micro color dots (R G B) -->
    <circle cx="3" cy="-8.5" r="2.5" fill="#EF4444"/>
    <circle cx="11" cy="-8.5" r="2.5" fill="#10B981"/>
    <circle cx="19" cy="-8.5" r="2.5" fill="#3B82F6"/>
    <text x="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.16em">sRGB STANDARD &amp; CRAFT</text>
  </g>
</svg>
